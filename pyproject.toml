# SPDX-License-Identifier: MIT
[project]
name = "sofifi-model"
version = "0.0.0"
description = "Modelo de referencia bit-exact de SOFIFI (golden model del RTL)"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[project.scripts]
sofifi = "sofifi.cli:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "hypothesis", "ruff", "mypy", "pyyaml", "types-PyYAML"]
# Cadena EDA abierta (Fase 02), toda instalable por pip. Las versiones mínimas son
# las verificadas con la Tang Primer 25K.
eda = [
    "yowasp-yosys>=0.69",
    "yowasp-nextpnr-himbaechel-gowin>=0.11.1",
    "apycula>=0.32",
    "openfpgaloader>=1.1.1",
    "verilator>=5.48",
    "cocotb>=2.1",
    "pyserial>=3.5",
    "types-pyserial",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["model"]
include = ["sofifi*"]

[tool.pytest.ini_options]
# Recolección acotada: un solo directorio y sufijo propio (SPEC_RAIZ §4.1).
testpaths = ["model/tests"]
python_files = ["*_test.py"]
pythonpath = ["model"]
addopts = "-q --cov=sofifi --cov-report=term --cov-report=json:.coverage.json"

[tool.coverage.run]
data_file = ".coverage"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# RUF001-003 (Unicode ambiguo): la prosa técnica en español usa ×, ², ³ y ·
# a propósito; en la Fase 01 produjo 100 % falsos positivos (8 de 8).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
files = ["model/sofifi", "model/tests", "scripts"]
mypy_path = "model"
strict = true
explicit_package_bases = true
