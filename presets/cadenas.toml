# SPDX-License-Identifier: MIT
#
# Banco de cadenas de SOFIFI: dos programas en uno, en serie o en paralelo (ADR 0013).
# Cada [[cadena]] tiene:
#   nombre    el nombre que se ve en el pedal;
#   modo      "serie" (la salida del primero entra en el segundo) o "paralelo" (media de los dos);
#   efectos   los programas, en orden. En mandos, un número es un valor fijo y "potN" es el
#             potenciómetro N del pedal. Un mando que falta vale 0;
#   pots      dónde están los seis potenciómetros al cargar la cadena;
#   requiere  "sdram" si no cabe hasta que llegue la SDRAM: hoy solo le falta memoria.
# model/tests/cadenas_test.py comprueba que cada cadena cabe o que solo le falta memoria.

[[cadena]]
nombre = "Eco y muelle"
modo = "serie"
efectos = [
    { programa = "delay", mandos = ["pot0", "pot1", "pot2", 0.60] },
    { programa = "spring", mandos = ["pot3", 0.40, "pot4"] },
]
pots = [0.55, 0.40, 0.35, 0.60, 0.40, 0.00]

