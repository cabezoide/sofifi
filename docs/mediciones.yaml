# Mediciones (SPEC_RAIZ §9.3). Todos los campos son obligatorios; caducan (P5).
# Campos: id · caracteristica · nombre · valor · unidad · umbral · direccion · fecha
#         · caduca_en_dias · como · entorno · no_dice
mediciones:
  - id: MED-01
    caracteristica: M-03
    nombre: Velocidad del modelo procesando el plate
    valor: 2.2
    unidad: segundos de cómputo por segundo de audio
    umbral: 10
    direccion: menor_mejor
    fecha: 2026-10-07
    caduca_en_dias: 97
    como: ".venv/bin/sofifi render programas/plate.sasm <entrada.wav> out/plate.wav (cronometrado), o model/tests/programas_test.py con --durations"
    entorno: "Intel i7-11390H, Linux 7.0, Python 3.14.4, intérprete puro sin numpy en el bucle"
    no_dice: "Nada del hardware: la FPGA procesa en tiempo real por construcción (109 de 2048 ciclos). Solo mide si escuchar un algoritmo en el PC es ágil."
  - id: MED-02
    caracteristica: M-05
    nombre: Duración de la suite de programas en la compuerta
    valor: 22
    unidad: segundos
    umbral: 60
    direccion: menor_mejor
    fecha: 2026-10-07
    caduca_en_dias: 61
    como: ".venv/bin/python -m pytest model/tests/programas_test.py --durations=5"
    entorno: "Intel i7-11390H, Linux 7.0, Python 3.14.4"
    no_dice: "No incluye el resto de la compuerta (unos 3 s). Si supera el umbral, las pruebas largas pasan a compuerta blanda o se acortan."
  - id: MED-03
    caracteristica: M-06
    nombre: Recepción de "SOFIFI" desde la placa por la UART del depurador
    valor: 1.0001
    unidad: segundos entre mensajes (medidos con el reloj del PC, 30 s)
    umbral: 1.01
    direccion: menor_mejor
    fecha: 2026-10-07
    caduca_en_dias: 90
    como: "make prog && .venv/bin/python scripts/leer_uart.py --segundos 30"
    entorno: "Tang Primer 25K + Dock, BL616 en /dev/ttyUSB1, 115 200 8N1, cadena EDA del extra eda de pyproject.toml"
    no_dice: "No mide el reloj con precisión: la marca de tiempo es la del PC y solo acota el error en torno a 100 ppm. No prueba la recepción UART (RX) ni la flash: se programa la SRAM."
  - id: MED-04
