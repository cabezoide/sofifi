    nombre: Frecuencia máxima del top hola_uart según nextpnr
    valor: 366.84
    unidad: MHz
    umbral: 100
    direccion: mayor_mejor
    fecha: 2026-10-07
    caduca_en_dias: 180
    como: "make synth; campo relojes de build/hola_uart_recursos.json"
    entorno: "mismas herramientas que MED-04; restricción de 50 MHz (reloj E2)"
