    nombre: LUT4 que ocupa el top hola_uart
    valor: 207
    unidad: LUT4 de 23 040
    umbral: 1000
    direccion: menor_mejor
    fecha: 2026-10-07
    caduca_en_dias: 180
    como: "make synth; build/hola_uart_recursos.json (además, 82 ALU, 91 DFF y 3 IOB)"
    entorno: "yowasp-yosys 0.69, nextpnr-himbaechel-gowin 0.11.1, apycula 0.32, GW5A-LV25MG121NES"
    no_dice: "Nada del núcleo DSP. El log de nextpnr (Device utilisation) da 263 LUT4, más que el informe JSON: no se ha aclarado qué cuenta cada uno. La primera versión ocupaba 353 (466 según el log) porque convertía los 8 nibbles a ASCII con sumadores en paralelo."
