# Registro de madurez (SPEC_RAIZ §9.2). Niveles: 0 ausente · 1 declarada · 2 implementada
# · 3 verificada · 4 blindada · 5 medida. Un 2 honesto vale más que un 4 sin prueba.
capacidades:
  - id: M-01
    capacidad: Compuerta local con hook versionado
    nivel: 4
    evidencia: scripts/ci_local.sh
    scope: trabajos duros del día 0
    no_cubre: "integración remota: todo corre en local"
    brecha: "CI remota cuando haya minutos suficientes para la síntesis (revisión de ADR 0001)"
  - id: M-02
    capacidad: Arquitectura por capas del modelo
    nivel: 4
    evidencia: model/tests/arquitectura_test.py
    scope: imports entre capas, I/O en el dominio y ciclos de cabecera
    no_cubre: "que las capas tengan contenido: hoy están vacías"
    brecha: "llenar el dominio en la Fase 1"
  - id: M-03
    capacidad: Modelo bit-exact del núcleo DSP
    nivel: 4
    evidencia: model/tests/nucleo_test.py
    scope: "aritmética, ISA de 16 instrucciones, intérprete, ensamblador y CLI; pruebas en la compuerta dura"
    no_cubre: "nada del RTL: eso es M-08"
    brecha: "Fase 05: la equivalencia en la placa (M-08 la cubre en simulación)"
  - id: M-04
    capacidad: Documentación trilingüe (es, en, zh-CN)
    nivel: 4
    evidencia: scripts/check_i18n.py
    scope: README y sus traducciones selladas
    no_cubre: "la calidad de la traducción; ADRs y specs solo en español"
    brecha: "revisión de las traducciones por hablantes nativos"
  - id: M-05
    capacidad: Programas plate, shimmer y freeze
    nivel: 4
    evidencia: model/tests/programas_test.py
    scope: "decaen, se sostienen o suben una octava según lo esperado; huella bit-exact de regresión"
    no_cubre: "que suenen bien: no hay escucha registrada con guitarra real"
    brecha: "escucharlos con WAV de guitarra y anotar ajustes de coeficientes"
  - id: M-06
    capacidad: Cadena EDA abierta y primer bitstream en la placa
    nivel: 4
    evidencia: sim/comun/uart_tx_test.py
    scope: "UART TX con testbench cocotb y lint verilator en la compuerta dura; síntesis de hola_uart en la de release; mensaje recibido de la placa (MED-03)"
    no_cubre: "la prueba en placa es manual: ninguna compuerta programa la FPGA; tampoco hay programación de la flash"
    brecha: "Fase 05: captura del núcleo en la placa y comparación con el modelo (la UART RX ya está, MED-12)"
  - id: M-07
    capacidad: Primitivas Gowin del núcleo (DSP, BSRAM, PLL) verificadas en la placa
    nivel: 5
    evidencia: sim/primitivas/prueba_bsram_test.py
    scope: "envoltorios en rtl/primitivas/ con modelo de simulación; tops de prueba con testbench en la compuerta dura; MED-06 a MED-08 en la placa"
    no_cubre: "los modos de MULTALU27X18 y la BSRAM con dos escrituras; las pruebas en placa son manuales"
    brecha: "Fase 04: usar las primitivas en el núcleo y medir su timing a 100 MHz"
  - id: M-08
    capacidad: Núcleo DSP en RTL equivalente al modelo
    nivel: 5
    evidencia: sim/nucleo/nucleo_test.py
    scope: "plate, shimmer y freeze contra el modelo en la compuerta dura; cada bloque contra su función del modelo; el plate, igual al modelo en la placa a 100 MHz (MED-09 a MED-14)"
    no_cubre: "shimmer y freeze en la placa; el margen de reloj real es de al menos un 6 % (MED-14), por debajo del 20 % del ADR 0011"
    brecha: "antes de la Fase 06: secuenciador con lectura y ejecución solapadas, y margen de reloj de más del 20 %"
